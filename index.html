<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typo Scanner</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <header>
    <select id="source" title="Where pages come from">
      <option value="camera">Camera</option>
      <option value="scanner">Scanner folder</option>
    </select>
    <span id="camera-tools" class="tools">
    <select id="camera" title="Camera"></select>
    <button id="rotate" title="Rotate the camera (R or ⌘R; ⇧ to go left)">Rotate 0°</button>
    <button id="loupe" title="Magnifier (L) — scroll to zoom">Loupe</button>
    <select id="crop-mode" title="How to crop new captures (O)">
      <option value="rect">Rectangle crop</option>
      <option value="outline">Page outline</option>
    </select>
    <label id="lens-tools" class="lens" title="Lens correction: straightens lines that bow in or out" hidden>
      Lens <input id="lens" type="range" min="-0.4" max="0.4" step="0.005" value="0" />
    </label>
    <button id="crop-reset" title="Clear the crop or outline for the next captures" hidden>Reset</button>
    <button id="split" title="Split each capture into two pages at the gutter">Split</button>
    <span id="resolution" class="muted"></span>
    </span>
    <span class="spacer"></span>
    <span id="status" class="muted"></span>
    <button id="clear" title="Delete every page and start a new project" disabled>Clear</button>
    <button id="open" title="Open a saved project (⌘O)">Open…</button>
    <button id="save" title="Save the project, to change it later (⌘S; ⌘⇧S to save a copy)" disabled>Save</button>
    <button id="export" class="primary" title="Export the pages as a PDF (⌘E)" disabled>Export PDF…</button>
  </header>
  <main>
    <section id="stage">
      <div id="camera-view" class="view">
        <div id="viewport" class="viewport">
          <div id="frame" class="frame"><canvas id="preview"></canvas></div>
          <p id="message" hidden></p>
        </div>
        <div class="shutter-bar">
          <button id="capture" title="Capture (Space)" aria-label="Capture page"></button>
        </div>
      </div>
      <div id="intake-view" class="view" hidden>
        <div class="intake-bar">
          <button id="intake-folder" title="The folder your scanner saves into">Choose folder…</button>
          <span id="intake-path" class="muted"></span>
          <button id="intake-import" hidden></button>
          <span class="spacer"></span>
          <label>Scans per page
            <select id="intake-per-page">
              <option>1</option><option>2</option><option>3</option><option>4</option>
            </select>
          </label>
          <label title="Add each page as soon as its scans line up well"><input id="intake-auto" type="checkbox" /> Add automatically</label>
          <button id="intake-rotate" title="Turn the joined pages (R or ⌘R; ⇧ to go left)">Rotate 0°</button>
        </div>
        <div id="intake-viewport" class="viewport">
          <div id="intake-frame" class="frame"><canvas id="intake-canvas"></canvas></div>
          <p id="intake-message"></p>
        </div>
        <div class="intake-tray">
          <ol id="intake-tiles"></ol>
          <span id="intake-status" class="muted"></span>
          <span class="spacer"></span>
          <button id="intake-diff" title="Show where the selected scan disagrees with the others (D)">Difference</button>
          <button id="intake-snap" title="Line the selected scan up from where it is now (S)">Snap</button>
          <button id="intake-discard" title="Throw away these scans">Discard</button>
          <button id="intake-add" class="primary" title="Add to the pages (Enter)">Add page</button>
        </div>
      </div>
    </section>
    <aside id="sidebar">
      <div id="sidebar-resizer" title="Drag to resize · double-click to reset"></div>
      <div class="aside-bar">
        <div class="row">
          <button id="crop-selected" title="Crop or flatten the selected pages (⌘C)" disabled>Crop…</button>
          <button id="split-selected" title="Split the selected spreads into two pages each (⌘/)" disabled>Split…</button>
          <button id="unsplit-selected" title="Join split pages back into their spreads" hidden>Unsplit</button>
          <button id="rotate-left" class="icon" title="Rotate the selected pages left (⌘⇧R)" aria-label="Rotate left" disabled>⟲</button>
          <button id="rotate-right" class="icon" title="Rotate the selected pages right (⌘R)" aria-label="Rotate right" disabled>⟳</button>
          <span id="selection-count" class="muted"></span>
        </div>
        <div class="row segmented" role="group" aria-label="Select pages">
          <button id="select-all" title="Select every page in the range (⌘A selects every page)">All</button>
          <button id="select-odd" title="Select the odd-numbered pages in the range (⌘⌥A)">Odd</button>
          <button id="select-even" title="Select the even-numbered pages in the range (⌘⇧A)">Even</button>
          <button id="select-none" title="Select nothing (Esc)">None</button>
        </div>
        <input id="select-range" type="text" placeholder="Range, e.g. 3-12, 15" spellcheck="false" autocomplete="off"
          title="Pages to choose from (⌘⌃A). Leave empty to use the span of the current selection, or every page." />
        <p id="select-scope" class="muted"></p>
      </div>
      <ol id="pages"></ol>
      <p id="empty" class="muted">
        Drag on the preview to crop,<br />or choose Page outline to flatten.<br />
        <kbd>Space</kbd> captures a page.<br />
        <kbd>⌫</kbd> deletes the last one.
      </p>
    </aside>
  </main>
  <dialog id="viewer"><img alt="" /></dialog>
  <dialog id="editor">
    <header>
      <span id="editor-title"></span>
      <span class="spacer"></span>
      <select id="editor-mode">
        <option value="rect">Rectangle crop</option>
        <option value="outline">Page outline</option>
      </select>
      <label id="editor-lens-tools" class="lens" title="Lens correction: straightens lines that bow in or out" hidden>
        Lens <input id="editor-lens" type="range" min="-0.4" max="0.4" step="0.005" value="0" />
      </label>
      <button id="editor-preview" title="Show the result (⌘P)">Preview</button>
      <button id="editor-reset" title="Start the crop or split over (⌘⇧R)">Reset</button>
      <button id="editor-cancel" title="Close without changing anything (Esc)">Cancel</button>
      <button id="editor-apply" class="primary" title="Apply (⌘↩)">Crop</button>
    </header>
    <div class="editor-body">
      <div id="editor-viewport" class="viewport">
        <div id="editor-frame" class="frame"><img id="editor-img" alt="" draggable="false" /></div>
      </div>
      <aside id="editor-sidebar">
        <div class="row">
          <button id="editor-new-group" title="Put the picked pages in a group of their own, to adjust separately (⌘G; ⌘↑ ⌘↓ move them between groups)">New group</button>
          <button id="editor-remove" title="Leave the picked pages out of this edit (⌫)">Remove</button>
          <span id="editor-picked" class="muted"></span>
        </div>
        <div id="editor-groups"></div>
      </aside>
    </div>
  </dialog>
  <video id="video" playsinline muted></video>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
