[package]
name = "typo-scanner"
version = "0.1.0"
description = "Photograph pages with a webcam or iPhone and export them as a PDF"
authors = ["Tyler Paige"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2"
percent-encoding = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }

# Decoding photos is painfully slow unoptimised, so optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
# Only to check the menu's shortcuts parse; tauri builds its menus with it.
muda = "0.20"
